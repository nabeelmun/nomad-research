name: Build NomadLM iOS IPA

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build-ios:
    needs: checks
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - run: node node_modules/llama.rn/install/download-native-artifacts.js

      - name: Generate iOS Native Project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Record native build environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          pod --version

      - name: Build Xcode Project (Unsigned Release)
        run: |
          xcodebuild -workspace ios/NomadLM.xcworkspace \
            -scheme NomadLM \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            build

      - name: Package Unsigned IPA for Sideloading
        run: |
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/NomadLM.app build/Payload/
          cd build
          zip -r ../NomadLM-diagnostic-unsigned.ipa Payload
          cd ..
          ls -lh NomadLM-diagnostic-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomad-research-ios-ipa
          path: NomadLM-diagnostic-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
