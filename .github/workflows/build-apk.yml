name: Build Android APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci --ignore-scripts
      - run: node node_modules/llama.rn/install/download-native-artifacts.js
      - run: npx expo prebuild --platform android --no-clean --no-install
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Sign tagged releases with the project's persistent key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NOMAD_KEYSTORE_BASE64: ${{ secrets.NOMAD_KEYSTORE_BASE64 }}
          NOMAD_STORE_PASSWORD: ${{ secrets.NOMAD_STORE_PASSWORD }}
          NOMAD_KEY_PASSWORD: ${{ secrets.NOMAD_KEY_PASSWORD }}
          NOMAD_KEY_ALIAS: ${{ secrets.NOMAD_KEY_ALIAS }}
        run: |
          python scripts/write_keystore.py
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/nomad-release.jks" --ks-key-alias "$NOMAD_KEY_ALIAS" --ks-pass env:NOMAD_STORE_PASSWORD --key-pass env:NOMAD_KEY_PASSWORD android/app/build/outputs/apk/release/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > signing-verification.txt
      - run: python scripts/release_metadata.py
      - uses: actions/upload-artifact@v4
        with:
          name: nomad-android-${{ github.sha }}
          path: release/apk/*
          retention-days: 14
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nomad-android-${{ github.sha }}
          path: release/apk
      - name: Publish one immutable APK with matching provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists. Use a new version tag; existing assets are never overwritten."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release/apk/* --verify-tag --title "NomadLM $GITHUB_REF_NAME" --notes-file release/apk/release-notes.md
